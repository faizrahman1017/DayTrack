<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Planner Mobile - Sectioned Cards</title>

<!-- PWA: installability -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#262521">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121110">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  color-scheme: light dark;
  --bg-page: #d9d7d2;
  --bg-app: #f8f7f5;
  --border-app: #c9c7c1;
  --bg-card: #ffffff;
  --border-card: #e2e1dc;
  --border-subtle: #f2f2f2;
  --border-input: #ddd;
  --bg-subtle: #f2f1ee;
  --text-primary: #262521;
  --text-secondary: #777;
  --text-muted: #999;
  --text-faint: #aaa;
  --accent: #262521;
  --accent-contrast: #ffffff;
  --bg-secondary-btn: #f0f0f0;
  --text-secondary-btn: #333;
  --chip-bg: #262521;
  --chip-active-bg: #ffffff;
  --chip-active-text: #262521;
  --dot-personal: #e0e0e0;
  --bg-overlay: rgba(0,0,0,.4);
  --bg-modal-box: #ffffff;
  --bg-bottomnav: rgba(255,255,255,0.9);
  --border-bottomnav: #eaeaea;
  --danger-bg: #fdecea;
  --danger-text: #e0483c;
  --cell-bg: #ffffff;
  --cell-has-task-bg: #f5f4f1;
  --cell-muted-bg: #fbfbfa;
  --cell-muted-has-task-bg: #f7f7f5;
  --grid-line: #ececea;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg-page: #121110;
    --bg-app: #1c1b19;
    --border-app: #2c2a27;
    --bg-card: #242320;
    --border-card: #38362f;
    --border-subtle: #322f2b;
    --border-input: #47443f;
    --bg-subtle: #2b2a26;
    --text-primary: #f2f1ee;
    --text-secondary: #b7b5b0;
    --text-muted: #8a8884;
    --text-faint: #6f6d68;
    --accent: #f2f1ee;
    --accent-contrast: #1c1b19;
    --bg-secondary-btn: #322f2b;
    --text-secondary-btn: #eeece8;
    --chip-bg: #332f29;
    --chip-active-bg: #4a463d;
    --chip-active-text: #f2f1ee;
    --dot-personal: #332f2b;
    --bg-overlay: rgba(0,0,0,.6);
    --bg-modal-box: #211f1c;
    --bg-bottomnav: rgba(23,22,20,0.9);
    --border-bottomnav: #322f2b;
    --danger-bg: #3a201d;
    --danger-text: #ff7a6b;
    --cell-bg: #211f1c;
    --cell-has-task-bg: #2b2a26;
    --cell-muted-bg: #181715;
    --cell-muted-has-task-bg: #1e1d1a;
    --grid-line: #322f2b;
  }
}

html[data-theme="light"]{
  --bg-page:#d9d7d2;--bg-app:#f8f7f5;--border-app:#c9c7c1;--bg-card:#fff;--border-card:#e2e1dc;--border-subtle:#f2f2f2;--border-input:#ddd;--bg-subtle:#f2f1ee;--text-primary:#262521;--text-secondary:#777;--text-muted:#999;--text-faint:#aaa;--accent:#262521;--accent-contrast:#fff;--bg-secondary-btn:#f0f0f0;--text-secondary-btn:#333;--chip-bg:#262521;--chip-active-bg:#fff;--chip-active-text:#262521;--dot-personal:#e0e0e0;--bg-overlay:rgba(0,0,0,.4);--bg-modal-box:#fff;--bg-bottomnav:rgba(255,255,255,.9);--border-bottomnav:#eaeaea;--danger-bg:#fdecea;--danger-text:#e0483c;--cell-bg:#fff;--cell-has-task-bg:#f5f4f1;--cell-muted-bg:#fbfbfa;--cell-muted-has-task-bg:#f7f7f5;--grid-line:#ececea;
}
html[data-theme="dark"]{
  --bg-page:#121110;--bg-app:#1c1b19;--border-app:#2c2a27;--bg-card:#242320;--border-card:#38362f;--border-subtle:#322f2b;--border-input:#47443f;--bg-subtle:#2b2a26;--text-primary:#f2f1ee;--text-secondary:#b7b5b0;--text-muted:#8a8884;--text-faint:#6f6d68;--accent:#f2f1ee;--accent-contrast:#1c1b19;--bg-secondary-btn:#322f2b;--text-secondary-btn:#eeece8;--chip-bg:#332f29;--chip-active-bg:#4a463d;--chip-active-text:#f2f1ee;--dot-personal:#332f2b;--bg-overlay:rgba(0,0,0,.6);--bg-modal-box:#211f1c;--bg-bottomnav:rgba(23,22,20,.9);--border-bottomnav:#322f2b;--danger-bg:#3a201d;--danger-text:#ff7a6b;--cell-bg:#211f1c;--cell-has-task-bg:#2b2a26;--cell-muted-bg:#181715;--cell-muted-has-task-bg:#1e1d1a;--grid-line:#322f2b;
}

/* Desktop background & 9:16 ratio lock */
html{scroll-behavior:smooth;scroll-padding-top:20px}
body { margin: 0; font-family: Inter, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg-page); display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: var(--text-primary); }
.app { background: var(--bg-app); position: relative; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-app); width: 100vw; height: 100vh; }
@media (min-aspect-ratio: 9/16) { .app { height: 100vh; width: calc(100vh * 9 / 16); } }
@media (max-aspect-ratio: 9/16) { .app { width: 100vw; height: calc(100vw * 16 / 9); } }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; }

/* Main scroll area */
main { flex: 1; overflow-y: auto; scroll-behavior: smooth; padding: 32px 24px 100px 24px; }

/* Real tab/page switching: only the active page renders, each starts fresh at the top */
.page { display: none; }
.page.active { display: block; }

/* Card container used to separate sections */
.card { background: var(--bg-card); border-radius: 20px; padding: 20px; margin-bottom: 24px; border: 1px solid var(--border-card); }

.theme-btn{width:38px;height:38px;border:1px solid var(--border-card);border-radius:50%;background:var(--bg-card);color:var(--text-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:opacity .15s ease,transform .15s ease;}
.theme-btn:hover{opacity:.8}.theme-btn:active{transform:scale(.94)}.theme-btn svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top-actions{display:flex;align-items:center;gap:8px}

/* Header & Global Sections */
.top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
.eyebrow { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600; }
.title { font-size: 26px; font-weight: 800; margin: 4px 0; letter-spacing: -0.5px; }
.date { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
.btn { border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; background: var(--accent); color: var(--accent-contrast); font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn.secondary { background: var(--bg-secondary-btn); color: var(--text-secondary-btn); }
section { margin-bottom: 40px; }
.section-title { display: flex; justify-content: space-between; align-items: end; margin-bottom: 16px; padding-bottom: 8px; }
.section-title h2 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.3px; }
.section-title span { font-size: 12px; color: var(--text-muted); font-weight: 500;}

/* Tasks & notes/checklist feature */
.today-grid { display: flex; flex-direction: column; }

/* Compact side-by-side stat pills: shows Work + Personal progress together at a glance */
.stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
.stat-pill { flex: 1; background: var(--bg-subtle); border-radius: 14px; padding: 12px 14px; }
.stat-pill-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.stat-pill-label { font-size: 12px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.stat-pill-label .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.stat-pill-label .dot.work { background: var(--text-primary); }
.stat-pill-label .dot.personal { background: var(--dot-personal); border: 1px solid var(--border-input); }
.stat-pill-count { font-size: 11px; color: var(--text-muted); font-weight: 600; }

.task-group-head { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 12px; }
.task-group-head:first-of-type { margin-top: 0; }
.task-group-head h3 { margin: 0; font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
.progress-mini { font-size: 11px; color: var(--text-muted); font-weight: 600; text-align: right; }
.bar { height: 4px; background: var(--bg-subtle); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); transition: .3s ease; }
.tasks { display: flex; flex-direction: column; }
.task-divider { height: 1px; background: var(--border-subtle); margin: 4px 0 0; }

/* Clickable task row for editing (plain style inside the card) */
.task { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--border-subtle); cursor: pointer; transition: opacity 0.2s; }
.task:hover { opacity: 0.7; }
.task:last-child { border-bottom: none; padding-bottom: 4px; }

/* Checkbox */
.check { width: 18px; height: 18px; border: 1.5px solid var(--border-input); border-radius: 50%; cursor: pointer; position: relative; margin-top: 1px; }
.task.completed .check { background: var(--accent); border-color: var(--accent); }
.task.completed .check:after { content: "✓"; color: var(--accent-contrast); position: absolute; font-size: 11px; left: 3.5px; top: 1px; font-weight: bold; }
.task.completed .task-title { text-decoration: line-through; color: var(--text-faint); }
.task.completed .task-time { color: var(--text-faint); }

/* Title & priority dot */
.task-title-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 1px; }
.task-title { font-size: 14px; font-weight: 500; line-height: 1.4; color: var(--text-primary); }
.pri-box { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pri-box.high { background: #e0483c; } /* Red */
.pri-box.medium { background: #eaa927; } /* Yellow/Amber */
.pri-box.low { background: #3f9d5c; } /* Green */

/* Task time */
.task-time { font-size: 12px; font-weight: 500; color: var(--text-muted); padding-top: 2px; }

/* Sub-tasks / checklist styling (plain) */
.task-notes { font-size: 12px; color: var(--text-secondary); margin-top: 3px; padding-left: 12px; line-height: 1.5; border-left: 2px solid var(--border-subtle); }
.task-checklist { margin-top: 6px; display: flex; flex-direction: column; gap: 8px; }
.subtask { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.sub-check { width: 14px; height: 14px; border: 1px solid var(--border-input); border-radius: 4px; position: relative; flex-shrink: 0; margin-top: 2px; }
.subtask.done .sub-check { background: #888; border-color: #888; }
.subtask.done .sub-check:after { content: "✓"; color: white; position: absolute; font-size: 9px; left: 2px; top: 1px; font-weight: bold; }
.subtask.done .sub-text { text-decoration: line-through; color: var(--text-faint); }
.sub-text { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

/* Overall Progress Card */
.overall.card { display: flex; align-items: center; gap: 20px; padding: 24px 20px; }
.overall-copy { flex: 1; }
.overall-copy strong { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 0.5px; }
.overall-value { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: var(--text-primary); }

/* Calendar Headers & Nav */
.calendar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.calendar-nav { display: flex; gap: 6px; }
.calendar-nav button { border: 1px solid var(--border-card); background: var(--bg-card); border-radius: 6px; padding: 6px 12px; cursor: pointer; color: var(--text-primary); font-weight: bold; }
.tabs { display: flex; background: var(--chip-bg); padding: 4px; border-radius: 10px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 10px 12px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.55); cursor: pointer; border-radius: 8px; transition: 0.2s; text-align: center; }
.tabs button.active { background: var(--chip-active-bg); color: var(--chip-active-text); }

/* Month view (simplified, inside a card) */
.month { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, 72px); gap: 1px; background: var(--grid-line); border: 1px solid var(--grid-line); border-radius: 12px; overflow: hidden; }
.month-label { text-align: center; font-size: 10px; color: #fff; padding: 6px 0; background: var(--chip-bg); font-weight: 700; }
.month-cell { background: var(--cell-bg); height: 72px; padding: 6px 4px; overflow: hidden; cursor: pointer; }
.month-cell.has-task { background: var(--cell-has-task-bg); }
.month-cell.muted { color: var(--text-faint); background: var(--cell-muted-bg); }
.month-cell.muted.has-task { background: var(--cell-muted-has-task-bg); }
.month-cell.today .month-num { background: var(--accent); color: var(--accent-contrast); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 4px; }
.month-num { font-size: 11px; font-weight: 600; margin-bottom: 4px; text-align: center; color: var(--text-primary);}
.month-cell .mini-task { margin-bottom: 2px; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-secondary); line-height: 1.2; }
.month-cell .mini-task::before { content: "•"; margin-right: 3px; color: var(--text-faint); }

/* Vertical weekly view (plain layout inside a card) */
.week-vertical { display: flex; flex-direction: column; }
.day-row { display: flex; padding: 16px 0; gap: 16px; align-items: flex-start; border-bottom: 1px solid var(--border-subtle); }
.day-row:last-child { border-bottom: none; padding-bottom: 0; }
.day-row:first-child { padding-top: 0; }
.day-row.today .day-num { color: var(--text-primary); }
.day-row.today .day-name { color: var(--text-primary); font-weight: 700; }
.day-row-date { display: flex; flex-direction: column; align-items: center; width: 44px; flex-shrink: 0; cursor: pointer; }
.day-row-date .day-name { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
.day-row-date .day-num { font-size: 24px; font-weight: 800; margin-top: 2px; color: var(--text-faint); letter-spacing: -0.5px; }
.day-row-tasks { flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.mini-task-list { font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-primary); line-height: 1.4; padding: 2px 0; }
.mini-task-list span { flex: 1; font-weight: 500; }
.mini-task-list.done span { text-decoration: line-through; color: var(--text-faint); }
/* Simple dot indicator in the weekly view */
.mini-task-list.work::before { content: "•"; color: var(--text-faint); margin-right: 8px; font-size: 18px; line-height: 0; }
.mini-task-list.personal::before { content: "•"; color: var(--dot-personal); margin-right: 8px; font-size: 18px; line-height: 0; }

/* Small plus button in the weekly view (minimal) */
.add-mini-plus { background: transparent; color: var(--text-muted); border: none; font-size: 18px; font-weight: 400; cursor: pointer; display: flex; align-items: center; justify-content: center; align-self: flex-start; margin-top: 4px; padding: 0 8px 0 0; transition: color 0.2s; }
.add-mini-plus:hover { color: var(--text-primary); }

/* Upcoming list redesign (plain rows inside a card) */
.upcoming-item-new { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border-subtle); cursor: pointer; transition: opacity 0.2s; }
.upcoming-item-new:hover { opacity: 0.7; }
.upcoming-item-new:last-child { border-bottom: none; padding-bottom: 0; }
.upcoming-item-new:first-child { padding-top: 0; }
.upcoming-date-box { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; background: var(--bg-subtle); border-radius: 10px; padding: 8px 0; }
.up-date { font-size: 18px; font-weight: 800; color: var(--text-primary); line-height: 1; letter-spacing: -0.5px; }
.up-month { font-size: 10px; font-weight: 700; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.upcoming-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.upcoming-type-text { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }

/* Bottom navigation (minimal, with a blurred background) */
.bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--bg-bottomnav); backdrop-filter: blur(10px); border-top: 1px solid var(--border-bottomnav); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 24px 20px; z-index: 10; }
.nav-tab { flex: 1; background: transparent; border: 0; padding: 8px; color: var(--text-faint); font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
.nav-tab.active { color: var(--text-primary); font-weight: 700; }
.nav-add { flex-shrink: 0; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-contrast); border: 2px solid var(--accent); font-size: 24px; font-weight: 400; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s ease, opacity 0.15s ease; }
.nav-add:hover { opacity: 0.9; }
.nav-add:active { transform: scale(0.94); }

/* Custom modal & checklist input builder */
.modal { position: absolute; inset: 0; background: var(--bg-overlay); backdrop-filter: blur(2px); display: none; align-items: flex-end; padding: 0; z-index: 50; }
.modal.show { display: flex; animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-box { background: var(--bg-modal-box); width: 100%; border-radius: 24px 24px 0 0; padding: 32px 24px; max-height: 90vh; overflow-y: auto; }
.modal-box h2 { margin: 0 0 24px; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.field { margin-bottom: 20px; }
.field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
.field input, .field select, .field textarea { width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid var(--border-input); background: transparent; outline: none; font-size: 15px; font-weight: 500; border-radius: 0; color: var(--text-primary); }
.field input:focus, .field select:focus, .field textarea:focus { border-bottom-color: var(--accent); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; }
.modal-actions.with-delete { justify-content: space-between; }
.modal-actions .btn { border-radius: 10px; padding: 12px 24px; }
.modal-actions .btn.secondary { background: var(--bg-secondary-btn); color: var(--text-secondary-btn); }
.modal-actions .btn.danger { background: var(--danger-bg); color: var(--danger-text); }

/* Reschedule (copy/move to another date) */
.reschedule-box { background: var(--bg-subtle); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
.reschedule-box label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
.reschedule-box input[type="date"] { width: 100%; padding: 10px 0; border: none; border-bottom: 1px solid var(--border-input); background: transparent; outline: none; font-size: 15px; font-weight: 500; margin-bottom: 12px; color: var(--text-primary); }
.reschedule-actions { display: flex; gap: 10px; }
.reschedule-actions button { flex: 1; border-radius: 10px; padding: 10px 12px; font-size: 13px; }

/* Sublist Input Box */
.sub-input-row { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border-input); align-items: center; }
.sub-input-row input { border: none; padding: 12px 0; flex: 1; font-size: 14px; background: transparent; color: var(--text-primary); }
.sub-input-row button { background: none; border: none; font-weight: 300; font-size: 24px; color: var(--text-primary); cursor: pointer; padding: 0 8px; }
.sublist-render { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.sub-item-edit { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; color: var(--text-secondary-btn); padding: 8px 12px; background: var(--bg-subtle); border-radius: 8px; }
.sub-item-edit button { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 0;}
.empty { font-size: 13px; color: var(--text-faint); padding: 12px 0; font-style: italic; text-align: center;}

/* Undo toast */
.toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(20px); background: #262521; color: #fff; padding: 12px 18px; border-radius: 12px; display: flex; align-items: center; gap: 16px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; z-index: 60; max-width: calc(100% - 48px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast button { background: transparent; border: 0; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; text-decoration: underline; white-space: nowrap; flex-shrink: 0; }


/* ── Notes ─────────────────────────────────────────────────── */
/* Note card — title only in the list */
.note-card { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border-subtle); }
.note-card:last-child { border-bottom: none; padding-bottom: 0; }
.note-card:first-child { padding-top: 0; }
.note-card-body { flex: 1; min-width: 0; cursor: pointer; }
.note-card-body:hover .note-card-title { opacity: .72; }
.note-card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); line-height: 1.3; margin-bottom: 3px; }
/* tiny timestamps */
.note-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.note-meta-item { font-size: 9px; color: var(--text-faint); font-weight: 400; letter-spacing: .1px; }
.note-meta-item b { font-weight: 500; color: var(--text-faint); }

/* three-dot menu button */
.note-menu-btn { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent; color: var(--text-muted); font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: background .15s; }
.note-menu-btn:hover { background: var(--bg-subtle); }
/* dropdown */
.note-menu-dropdown { position: absolute; right: 0; top: 32px; background: var(--bg-modal-box); border: 1px solid var(--border-card); border-radius: 12px; overflow: hidden; min-width: 130px; z-index: 80; }
.note-menu-dropdown button { display: block; width: 100%; padding: 12px 16px; text-align: left; background: transparent; border: none; font-size: 13px; font-weight: 500; color: var(--text-primary); cursor: pointer; }
.note-menu-dropdown button:hover { background: var(--bg-subtle); }
.note-menu-dropdown button.danger { color: var(--danger-text); }
.note-menu-dropdown button + button { border-top: 1px solid var(--border-subtle); }

/* Note detail modal */
.note-detail-body { font-size: 14px; color: var(--text-secondary); line-height: 1.7; white-space: pre-wrap; word-break: break-word; margin-bottom: 8px; }
/* note checklist inside detail/edit modal */
.note-checklist-wrap { display: flex; flex-direction: column; }
.note-sub-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border-subtle); }
.note-sub-row:last-child { border-bottom: none; }
.note-sub-check { width: 16px; height: 16px; border: 1.5px solid var(--border-input); border-radius: 4px; flex-shrink: 0; margin-top: 2px; position: relative; cursor: pointer; }
.note-sub-row.done .note-sub-check { background: var(--accent); border-color: var(--accent); }
.note-sub-row.done .note-sub-check:after { content:"✓"; color: var(--accent-contrast); position: absolute; font-size: 10px; left: 2px; top: 0; font-weight: bold; }
.note-sub-row.done .note-sub-text { text-decoration: line-through; color: var(--text-faint); }
.note-sub-text { font-size: 14px; font-weight: 500; color: var(--text-primary); line-height: 1.4; flex: 1; }

/* add sub item row inside note edit modal */
.note-add-row { display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border-input); margin-top: 8px; }
.note-add-row input { border: none; padding: 10px 0; flex: 1; font-size: 14px; background: transparent; color: var(--text-primary); outline: none; }
.note-add-row button { background: none; border: none; font-size: 22px; font-weight: 300; color: var(--text-primary); cursor: pointer; padding: 0 6px; }

/* Note modal meta timestamps */
.note-modal-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; margin-top: -10px; }
.note-modal-meta span { font-size: 10px; color: var(--text-faint); font-weight: 400; }
.note-modal-meta b { font-weight: 500; }

/* empty notes */
.notes-empty { text-align: center; padding: 32px 16px; }
.notes-empty-icon { font-size: 32px; margin-bottom: 10px; }
.notes-empty-text { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.notes-empty-text strong { color: var(--text-primary); display: block; margin-bottom: 4px; font-size: 15px; }

/* ── Notes: centered popup preview ─────────────────────────── */
#noteDetailModal{
  align-items:center;
  justify-content:center;
  padding:24px;
}
#noteDetailModal.show{
  animation: notePopupFade .22s ease-out;
}
#noteDetailModal .modal-box{
  width:min(720px, calc(100% - 8px));
  max-height:82vh;
  border-radius:28px;
  padding:36px 38px 30px;
  box-shadow:0 24px 70px rgba(0,0,0,.22);
  animation: notePopupIn .24s cubic-bezier(.2,.8,.2,1);
}
#noteDetailModal #noteDetailTitle{
  margin:0 0 12px !important;
  font-size:26px;
  line-height:1.15;
  letter-spacing:-.7px;
}
#noteDetailModal .note-modal-meta{
  margin:0 0 28px;
  gap:8px 18px;
  align-items:center;
  line-height:1.5;
}
#noteDetailModal .note-meta-item{
  font-size:11px;
  line-height:1.5;
}
#noteDetailModal #noteDetailContent{
  padding-top:2px;
}
#noteDetailModal .note-checklist-wrap{
  gap:0;
}
#noteDetailModal .note-sub-row{
  padding:15px 0;
}
#noteDetailModal .note-sub-text{
  font-size:15px;
  line-height:1.5;
}
#noteDetailModal .modal-actions{
  margin-top:28px !important;
  padding-top:4px;
}
@keyframes notePopupFade{
  from{opacity:0}
  to{opacity:1}
}
@keyframes notePopupIn{
  from{transform:translateY(12px) scale(.975);opacity:0}
  to{transform:translateY(0) scale(1);opacity:1}
}
@media (max-width:560px){
  #noteDetailModal{padding:16px}
  #noteDetailModal .modal-box{
    width:100%;
    max-height:86vh;
    border-radius:24px;
    padding:30px 24px 24px;
  }
  #noteDetailModal #noteDetailTitle{font-size:23px}
}

</style>
</head>
<body>

<div class="app">
  <main id="scrollArea">
    <header class="top">
      <div>
        <div class="eyebrow">Your Day, Organized</div>
        <div class="title">Good morning.</div>
        <div class="date" id="currentDate"></div>
      </div>
      <div class="top-actions">
        <button class="theme-btn" id="themeBtn" type="button" onclick="toggleTheme()" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
        <button class="btn" id="installBtn" style="display:none;" onclick="installApp()">Install app</button>
      </div>
    </header>

    <section id="pageDayPlan" class="page active">
      <section id="dpToday">
        <div class="section-title"><h2>Today</h2><span id="todayLabel"></span></div>

        <!-- Work + Personal shown together in one card so the day's full load is visible at a glance -->
        <div class="card today-grid">
          <div class="stat-row">
            <div class="stat-pill">
              <div class="stat-pill-top">
                <div class="stat-pill-label"><span class="dot work"></span>Work</div>
                <div class="stat-pill-count" id="workProgress"></div>
              </div>
              <div class="bar"><i id="workBar"></i></div>
            </div>
            <div class="stat-pill">
              <div class="stat-pill-top">
                <div class="stat-pill-label"><span class="dot personal"></span>Personal</div>
                <div class="stat-pill-count" id="personalProgress"></div>
              </div>
              <div class="bar"><i id="personalBar"></i></div>
            </div>
          </div>

          <div class="task-group-head"><h3>Work</h3></div>
          <div class="tasks" id="workTasks"></div>

          <div class="task-divider"></div>

          <div class="task-group-head"><h3>Personal</h3></div>
          <div class="tasks" id="personalTasks"></div>
        </div>
      </section>

      <section id="dpCalendar">
        <div class="section-title">
          <h2 id="calendarTitle">Calendar</h2>
          <div class="calendar-nav"><button onclick="moveCalendar(-1)">‹</button><button onclick="moveCalendar(1)">›</button></div>
        </div>

        <div style="margin-bottom: 16px;">
           <div class="tabs"><button class="active" id="weekTab" onclick="setView('week')">Weekly</button><button id="monthTab" onclick="setView('month')">Monthly</button></div>
        </div>

        <!-- Calendar content inside a card -->
        <div class="card" style="padding: 0; overflow: hidden;" id="calendarWrap">
          <!-- padding removed so the month grid reaches the card's edges; controlled via JS -->
          <div id="calendarContent"></div>
        </div>
      </section>

      <section id="dpUpcoming">
        <div class="section-title"><h2>Upcoming</h2><span>Future tasks</span></div>
        <!-- Upcoming list inside a card -->
        <div class="card upcoming" id="upcomingList"></div>
      </section>
    </section>

    <!-- ── NOTES ────────────────────────────────────────────── -->
    <section id="pageNotes" class="page">
      <div class="section-title">
        <h2>Notes</h2>
        <button class="btn" style="padding:6px 14px;font-size:12px;" onclick="openNoteModal()">+ New note</button>
      </div>
      <div class="card" id="notesList"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-tab active" onclick="showPage('dayplan', this)">Day Plan</button>
    <button class="nav-add" onclick="openModal()" aria-label="Add task">+</button>
    <button class="nav-tab" onclick="showPage('notes', this)">Notes</button>
  </nav>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2 id="modalTitle">Task Details</h2>
      <div class="field"><label>Task Name</label><input id="taskTitle" placeholder="What needs to be done?"></div>
      <div class="form-grid">
        <div class="field"><label>Category</label><select id="taskType"><option value="work">Work</option><option value="personal">Personal</option></select></div>
        <div class="field"><label>Priority</label><select id="taskPriority"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div>
      </div>
      <div class="form-grid">
        <div class="field"><label>Date</label><input id="taskDate" type="date"></div>
        <div class="field"><label>Time</label><input id="taskTime" type="time"></div>
      </div>
      
      <div class="field">
        <label>Extra Details</label>
        <select id="noteType" onchange="toggleNoteUI()">
          <option value="none">None</option>
          <option value="text">Descriptive Note</option>
          <option value="list">Checklist</option>
        </select>
      </div>
      
      <div class="field" id="wrapTextNote" style="display:none;">
        <textarea id="taskNoteText" rows="3" placeholder="Add notes here..."></textarea>
      </div>
      
      <div class="field" id="wrapListNote" style="display:none;">
        <div class="sub-input-row">
          <input type="text" id="subInput" placeholder="Add a sub-task...">
          <button type="button" onclick="addSubItem()">+</button>
        </div>
        <div class="sublist-render" id="sublistContainer"></div>
      </div>

      <div class="reschedule-box" id="rescheduleBox" style="display:none;">
        <label>Reschedule this task</label>
        <input type="date" id="rescheduleDate">
        <div class="reschedule-actions">
          <button type="button" class="btn secondary" onclick="copyTaskToDate()">Copy to date</button>
          <button type="button" class="btn secondary" onclick="moveTaskToDate()">Move to date</button>
        </div>
      </div>

      <div class="modal-actions with-delete">
        <button class="btn danger" id="deleteTaskBtn" style="display:none;" onclick="deleteTask()">Delete</button>
        <div style="display:flex; gap:12px;">
          <button class="btn secondary" onclick="closeModal()">Cancel</button>
          <button class="btn" onclick="saveTask()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="dayModal">
    <div class="modal-box">
      <h2 id="dayModalTitle">Day</h2>
      <div class="tasks" id="dayModalTasks"></div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="closeDayModal()">Close</button>
        <button class="btn" onclick="addTaskForDay()">+ Add task</button>
      </div>
    </div>
  </div>

  <!-- Note detail modal (read / checklist-toggle) -->
  <div class="modal" id="noteDetailModal">
    <div class="modal-box">
      <h2 id="noteDetailTitle" style="margin-bottom:6px;"></h2>
      <div class="note-modal-meta" id="noteDetailMeta"></div>
      <div id="noteDetailContent"></div>
      <div class="modal-actions" style="margin-top:24px;">
        <button class="btn secondary" onclick="closeNoteDetailModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Note edit modal (create / edit) -->
  <div class="modal" id="noteModal">
    <div class="modal-box">
      <h2 id="noteModalTitle">New Note</h2>
      <div class="note-modal-meta" id="noteModalMeta" style="display:none;">
        <span id="noteMetaCreated"></span>
        <span id="noteMetaUpdated" style="display:none;"></span>
      </div>
      <div class="field">
        <label>Title</label>
        <input id="noteTitle" placeholder="Give this note a title…">
      </div>
      <div class="field">
        <label>Content type</label>
        <select id="noteContentType" onchange="toggleNoteContentUI()">
          <option value="text">Descriptive</option>
          <option value="list">Checklist</option>
        </select>
      </div>
      <div class="field" id="wrapNoteText">
        <label>Note</label>
        <textarea id="noteBody" rows="5" placeholder="Write anything here…"></textarea>
      </div>
      <div class="field" id="wrapNoteList" style="display:none;">
        <label>Checklist</label>
        <div class="note-checklist-wrap" id="noteChecklistWrap"></div>
        <div class="note-add-row">
          <input type="text" id="noteSubInput" placeholder="Add item…">
          <button type="button" onclick="addNoteSubItem()">+</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="closeNoteModal()">Cancel</button>
        <button class="btn" onclick="saveNote()">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toastMsg"></span>
    <button onclick="undoDelete()">Undo</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'dailyPlannerTasks_v3_clean';
const LEGACY_STORAGE_KEY = 'dailyPlannerTasks';
const THEME_KEY = 'daytrackTheme';
const DATA_VERSION = 2;
const SAMPLE_TITLES = new Set(['Client presentation','Buy groceries','Reply emails','Project proposal','Weekend trip prep','Review project brief','Finalize presentation','Reply important emails','Workout']);

function isValidDateString(value){
  if(typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const d=dateFrom(value);
  return !Number.isNaN(d.getTime()) && iso(d)===value;
}

function createId(){
  if(window.crypto && typeof window.crypto.randomUUID==='function') return window.crypto.randomUUID();
  return `${Date.now()}_${Math.random().toString(36).slice(2,10)}`;
}

function safeGet(key){
  try{return localStorage.getItem(key)}catch(e){return null}
}

function safeSet(key,value){
  try{localStorage.setItem(key,value);return true}catch(e){console.warn('Could not save local data.',e);return false}
}

function normalizeTask(task,usedIds=new Set()){
  if(!task || typeof task !== 'object') return null;
  const title=typeof task.title==='string' ? task.title.trim() : '';
  const date=typeof task.date==='string' && isValidDateString(task.date) ? task.date : '';
  if(!title || !date) return null;
  const type=task.type==='personal' ? 'personal' : 'work';
  const priority=['high','medium','low'].includes(task.priority) ? task.priority : 'medium';
  const time=typeof task.time==='string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(task.time) ? task.time : '';
  const noteType=['none','text','list'].includes(task.noteType) ? task.noteType : 'none';
  const checklist=Array.isArray(task.checklist) ? task.checklist.map(c=>{
    if(!c || typeof c.text!=='string' || !c.text.trim()) return null;
    return {id:createId(),text:c.text.trim(),done:Boolean(c.done)};
  }).filter(Boolean) : [];
  return {
    id: (()=>{ const candidate=task.id !== undefined && task.id !== null ? String(task.id) : ''; if(candidate && !usedIds.has(candidate)){ usedIds.add(candidate); return candidate; } const id=createId(); usedIds.add(id); return id; })(),
    title,type,priority,date,time,
    completed:Boolean(task.completed),
    noteType,
    noteText:noteType==='text' && typeof task.noteText==='string' ? task.noteText : '',
    checklist:noteType==='list' ? checklist : [],
    createdAt:typeof task.createdAt==='string' ? task.createdAt : new Date().toISOString(),
    updatedAt:typeof task.updatedAt==='string' ? task.updatedAt : new Date().toISOString()
  };
}

function sanitizeTasks(value, removeSamples=false){
  const source=Array.isArray(value) ? value : (value && Array.isArray(value.tasks) ? value.tasks : null);
  if(!source) return null;
  const usedIds=new Set();
  return source.map(task=>normalizeTask(task,usedIds)).filter(Boolean).filter(t=>!(removeSamples && SAMPLE_TITLES.has(t.title)));
}

function loadTasks(){
  try {
    const raw=safeGet(STORAGE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      const clean=sanitizeTasks(parsed);
      if(clean) return clean;
    }
    const legacyRaw=safeGet(LEGACY_STORAGE_KEY);
    if(legacyRaw){
      const legacy=JSON.parse(legacyRaw);
      const migrated=sanitizeTasks(legacy,true);
      if(migrated){ safeSet(STORAGE_KEY,JSON.stringify(migrated)); return migrated; }
    }
  } catch(e){
    console.warn('Could not load saved tasks.',e);
  }
  return [];
}

let tasks=loadTasks();
let editId=null, view='week', calendarDate=new Date();
let tempChecklist = []; 
let dayModalDate = null;

function pad(n){return String(n).padStart(2,'0')}
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dateFrom(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function today(){return iso(new Date())}
function fmtDate(s,opt={day:'numeric',month:'short',year:'numeric'}){return dateFrom(s).toLocaleDateString('en-US',opt)}
function save(){
  try {
    safeSet(STORAGE_KEY,JSON.stringify(tasks));
  } catch(e){
    console.warn('Could not save tasks to local storage.',e);
  }
}
function sunday(d){let x=new Date(d);let day=x.getDay();x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
// Tasks always display earliest-time-first, regardless of the order they were entered in.
// Tasks with no time set are pushed to the end of that day's list.
function sortByTime(arr){return arr.slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}

function seed(){
  if(!Array.isArray(tasks)) tasks=[];
  save();
}

const PAGE_IDS = { dayplan: 'pageDayPlan', notes: 'pageNotes' };

function showPage(page,btn){
 const targetId = PAGE_IDS[page];
 document.querySelectorAll('main > .page').forEach(sec => sec.classList.toggle('active', sec.id === targetId));
 document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
 if(btn) btn.classList.add('active');
 const scrollArea = document.getElementById('scrollArea');
 if(scrollArea) scrollArea.scrollTop = 0;
}

function toggleSubTask(taskId, subId, e){
  if(e) e.stopPropagation();
  let t = tasks.find(x => String(x.id) === String(taskId));
  if(t && t.checklist){
    let sub = t.checklist.find(x => String(x.id) === String(subId));
    if(sub) { sub.done = !sub.done; save(); renderAll(); refreshDayModal(); }
  }
}

function toggleTask(id, e){
  if(e) e.stopPropagation();
  let t=tasks.find(x=>String(x.id)===String(id));
  if(t){t.completed=!t.completed;save();renderAll();refreshDayModal()}
}

function esc(s){return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function jsArg(value){ return "'" + String(value).replace(/'/g,"\'") + "'"; }

function taskHTML(t){
 let notesHtml = '';
 if (t.noteType === 'text' && t.noteText) {
   notesHtml = `<div class="task-notes">${esc(t.noteText).replace(/\n/g, '<br>')}</div>`;
 } else if (t.noteType === 'list' && t.checklist && t.checklist.length > 0) {
   notesHtml = `<div class="task-checklist">` + 
     t.checklist.map(c => `
       <div class="subtask ${c.done ? 'done' : ''}" data-task-id="${esc(t.id)}" onclick="toggleSubTask(${jsArg(t.id)}, ${jsArg(c.id)}, event)">
         <div class="sub-check"></div>
         <div class="sub-text">${esc(c.text)}</div>
       </div>`).join('') + `</div>`;
 }

 return `<div class="task ${t.completed?'completed':''}" data-task-id="${esc(t.id)}" onclick="editTask(${jsArg(t.id)})">
 <div class="check" data-task-id="${esc(t.id)}" onclick="toggleTask(${jsArg(t.id)}, event)"></div>
 <div style="min-width:0;">
   <div class="task-title-wrap">
     <div class="task-title">${esc(t.title)}</div>
     ${t.priority ? `<div class="pri-box ${t.priority}"></div>` : ''}
   </div>
   ${notesHtml}
 </div>
 <div class="task-time">${t.time||''}</div>
 </div>`
}

function sectionProgress(arr,label){
 let done=arr.filter(t=>t.completed).length,total=arr.length,p=total?Math.round(done/total*100):0;
 document.getElementById(label+'Progress').textContent=`${done}/${total}`;
 document.getElementById(label+'Bar').style.width=p+'%'
}

function renderToday(){
 let ts=sortByTime(tasks.filter(t=>t.date===today())),w=ts.filter(t=>t.type==='work'),p=ts.filter(t=>t.type==='personal');
 document.getElementById('currentDate').textContent=fmtDate(today(),{weekday:'short',day:'numeric',month:'short',year:'numeric'});
 document.getElementById('todayLabel').textContent=fmtDate(today(), {day:'numeric',month:'short'});
 document.getElementById('workTasks').innerHTML=w.length?w.map(taskHTML).join(''):'<div class="empty">No tasks yet — tap + to add one.</div>';
 document.getElementById('personalTasks').innerHTML=p.length?p.map(taskHTML).join(''):'<div class="empty">No tasks yet — tap + to add one.</div>';
 sectionProgress(w,'work');sectionProgress(p,'personal');
}

function renderWeek(){
 let start=sunday(calendarDate),days=[...Array(7)].map((_,i)=>addDays(start,i));
 document.getElementById('calendarTitle').textContent=`${fmtDate(iso(days[0]),{day:'numeric',month:'short'})} - ${fmtDate(iso(days[6]),{day:'numeric',month:'short'})}`;
 document.getElementById('calendarWrap').style.padding = '20px';
 
 document.getElementById('calendarContent').innerHTML='<div class="week-vertical">'+days.map((d)=>{
   let s=iso(d),ts=sortByTime(tasks.filter(t=>t.date===s));
   return `<div class="day-row ${s===today()?'today':''}">
     <div class="day-row-date" onclick="openDayModal('${s}')">
       <div class="day-name">${d.toLocaleDateString('en-US',{weekday:'short'})}</div>
       <div class="day-num">${d.getDate()}</div>
     </div>
     <div class="day-row-tasks">
       ${ts.map(t=>`<div class="mini-task-list ${t.type} ${t.completed?'done':''}" data-task-id="${esc(t.id)}" onclick="editTask(${jsArg(t.id)})"><span>${esc(t.title)}</span></div>`).join('')}
       <button class="add-mini-plus" onclick="openModal('${s}')">+</button>
     </div>
   </div>`
 }).join('')+'</div>';
}

function renderMonth(){
 let y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),start=sunday(first),cells=[...Array(42)].map((_,i)=>addDays(start,i));
 document.getElementById('calendarTitle').textContent=calendarDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
 document.getElementById('calendarWrap').style.padding = '0'; // edge-to-edge inside the card, controlled here

 let labels=['S','M','T','W','T','F','S'].map(x=>`<div class="month-label">${x}</div>`).join('');
 document.getElementById('calendarContent').innerHTML='<div class="month">'+labels+cells.map(d=>{
   let s=iso(d),ts=sortByTime(tasks.filter(t=>t.date===s));
   let cls=['month-cell'];
   if(d.getMonth()!==m) cls.push('muted');
   if(s===today()) cls.push('today');
   if(ts.length) cls.push('has-task');
   return `<div class="${cls.join(' ')}" onclick="openDayModal('${s}')"><div class="month-num">${d.getDate()}</div>${ts.slice(0,3).map(t=>`<div class="mini-task" onclick="event.stopPropagation();editTask(${jsArg(t.id)})">${esc(t.title)}</div>`).join('')}</div>`
 }).join('')+'</div>';
}

function renderCalendar(){view==='week'?renderWeek():renderMonth()}

function renderUpcoming(){
 let end=iso(addDays(sunday(new Date()),6)),arr=tasks.filter(t=>t.date>end).sort((a,b)=>(a.date+'_'+(a.time||'99:99')).localeCompare(b.date+'_'+(b.time||'99:99')));
 document.getElementById('upcomingList').innerHTML=arr.length?arr.map(t=>`
   <div class="upcoming-item-new" onclick="editTask(${jsArg(t.id)})">
     <div class="upcoming-date-box">
       <div class="up-date">${dateFrom(t.date).getDate()}</div>
       <div class="up-month">${dateFrom(t.date).toLocaleDateString('en-US',{month:'short'})}</div>
     </div>
     <div class="upcoming-info">
       <div class="task-title-wrap">
         <div class="task-title" style="font-size: 15px;">${esc(t.title)}</div>
         ${t.priority ? `<div class="pri-box ${t.priority}"></div>` : ''}
       </div>
       <div class="upcoming-type-text">${t.type}</div>
     </div>
     <div class="task-time">${t.time||''}</div>
   </div>`).join(''):'<div class="empty" style="padding-top:0">No upcoming tasks.</div>';
}

function renderAll(){renderToday();renderCalendar();renderUpcoming();renderNotes()}

function toggleNoteUI(){
  let type = document.getElementById('noteType').value;
  document.getElementById('wrapTextNote').style.display = type === 'text' ? 'block' : 'none';
  document.getElementById('wrapListNote').style.display = type === 'list' ? 'block' : 'none';
}

function addSubItem(){
  let input = document.getElementById('subInput');

    tempChecklist.push({id:createId(), text: input.value.trim(), done: false});
    input.value = '';

function removeSubItem(id){

  renderTempChecklist();
}

function renderTempChecklist(){
  document.getElementById('sublistContainer').innerHTML = tempChecklist.map(c =>

      <span>${esc(c.text)}</span>
      <button onclick="removeSubItem(${jsArg(c.id)})">✕</button>

function openModal(date=today()){
 editId=null;
 document.getElementById('modalTitle').textContent='Add task';
 document.getElementById('taskTitle').value='';
 document.getElementById('taskDate').value=date;
 document.getElementById('taskTime').value='';
 document.getElementById('noteType').value='none';
 document.getElementById('taskNoteText').value='';
 tempChecklist = [];
 renderTempChecklist();
 toggleNoteUI();
 document.getElementById('rescheduleBox').style.display='none';
 document.getElementById('deleteTaskBtn').style.display='none';
 document.getElementById('modal').classList.add('show');
}

function editTask(id){
 closeDayModal();
 let t=tasks.find(x=>String(x.id)===String(id));if(!t)return;editId=id;
 document.getElementById('modalTitle').textContent='Edit task';
 document.getElementById('taskTitle').value=t.title;
 document.getElementById('taskType').value=t.type;
 document.getElementById('taskPriority').value=t.priority;
 document.getElementById('taskDate').value=t.date;
 document.getElementById('taskTime').value=t.time||'';
 
 document.getElementById('noteType').value=t.noteType || 'none';
 document.getElementById('taskNoteText').value=t.noteText || '';
 tempChecklist = t.checklist ? JSON.parse(JSON.stringify(t.checklist)) : [];
 
 renderTempChecklist();
 toggleNoteUI();
 document.getElementById('rescheduleDate').value=t.date;
 document.getElementById('rescheduleBox').style.display='block';
 document.getElementById('deleteTaskBtn').style.display='inline-block';
 document.getElementById('modal').classList.add('show');
}

function closeModal(){document.getElementById('modal').classList.remove('show')}

function copyTaskToDate(){
 if(!editId) return;
 let t = tasks.find(x=>String(x.id)===String(editId));
 if(!t) return;
 let newDate = document.getElementById('rescheduleDate').value || t.date;
 let clone = JSON.parse(JSON.stringify(t));
 clone.id = createId();
 clone.date = newDate;
 clone.completed = false;
 if(clone.checklist){
   clone.checklist = clone.checklist.map(c=>({...c, id:createId(), done:false}));
 }
 tasks.push(clone);
 save();
 closeModal();
 renderAll();
}

function moveTaskToDate(){
 if(!editId) return;
 let t = tasks.find(x=>String(x.id)===String(editId));
 if(!t) return;
 let newDate = document.getElementById('rescheduleDate').value || t.date;
 t.date = newDate;
 save();
 closeModal();
 renderAll();
}

let lastDeleted = null;

function deleteTask(){
 if(!editId) return;
 let t = tasks.find(x=>String(x.id)===String(editId));
 if(!t) return;
 tasks = tasks.filter(x=>String(x.id)!==String(editId));
 save();
 closeModal();
 renderAll();
 refreshDayModal();
 showUndoToast(t);
}

function showUndoToast(deletedItem){
 if(lastDeleted && lastDeleted.timeoutId) clearTimeout(lastDeleted.timeoutId);
 lastDeleted = { task: deletedItem };
 const label = deletedItem.title || 'Item';
 document.getElementById('toastMsg').textContent = `Deleted "${label}"`;
 document.getElementById('toast').classList.add('show');
 lastDeleted.timeoutId = setTimeout(()=>{
   document.getElementById('toast').classList.remove('show');
   lastDeleted = null;
 }, 5000);
}

function undoDelete(){
 if(!lastDeleted) return;
 clearTimeout(lastDeleted.timeoutId);
 if(typeof lastDeleted._undoFn === 'function'){
   lastDeleted._undoFn();
 } else {
   tasks.push(lastDeleted.task);
   save();
   renderAll();
   refreshDayModal();
 }
 document.getElementById('toast').classList.remove('show');
 lastDeleted = null;
}

function renderDayModalTasks(){
 let ts = sortByTime(tasks.filter(t=>t.date===dayModalDate));
 document.getElementById('dayModalTasks').innerHTML = ts.length ? ts.map(taskHTML).join('') : '<div class="empty">No tasks for this day yet.</div>';
}

function openDayModal(dateStr){
 dayModalDate = dateStr;
 document.getElementById('dayModalTitle').textContent = dateFrom(dateStr).toLocaleDateString('en-US',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
 renderDayModalTasks();
 document.getElementById('dayModal').classList.add('show');
}

function closeDayModal(){
 document.getElementById('dayModal').classList.remove('show');
 dayModalDate = null;
}

function refreshDayModal(){
 if(dayModalDate && document.getElementById('dayModal').classList.contains('show')) renderDayModalTasks();
}

function addTaskForDay(){
 let d = dayModalDate;
 closeDayModal();
 openModal(d);
}

function saveTask(){
 let title=document.getElementById('taskTitle').value.trim();
 let date=document.getElementById('taskDate').value;
 if(!title){alert('Please enter a task name.');return;}
 if(!isValidDateString(date)){alert('Please choose a valid date.');return;}
 let noteType=document.getElementById('noteType').value;
 let now=new Date().toISOString();
 let data={
   title,
   type:document.getElementById('taskType').value,
   priority:document.getElementById('taskPriority').value,
   date,
   time:document.getElementById('taskTime').value,
   noteType,
   noteText:noteType==='text' ? document.getElementById('taskNoteText').value : '',
   checklist:noteType==='list' ? tempChecklist.map(c=>({...c})) : []
 };
 if(editId){
   let existing=tasks.find(t=>String(t.id)===String(editId));
   if(!existing) return;
   Object.assign(existing,data,{updatedAt:now});
 }else{
   tasks.push({id:createId(),completed:false,createdAt:now,updatedAt:now,...data});
 }
 save();closeModal();renderAll();
}

function setView(v){view=v;document.getElementById('weekTab').classList.toggle('active',v==='week');document.getElementById('monthTab').classList.toggle('active',v==='month');renderCalendar()}
function moveCalendar(n){if(view==='week')calendarDate=addDays(calendarDate,n*7);else calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+n,1);renderCalendar()}

// ── NOTES ────────────────────────────────────────────────────
const NOTES_KEY = 'daytrackNotes_v1';

function loadNotes(){
  try {
    const raw = safeGet(NOTES_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) return parsed;
    }
  } catch(e){ console.warn('Could not load notes.', e); }
  return [];
}

let notes = loadNotes();
let editNoteId = null;
let tempNoteChecklist = [];

function saveNotes(){
  safeSet(NOTES_KEY, JSON.stringify(notes));
}

function fmtTimestamp(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
    + ' · ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

// ── Note card: title + timestamps + three-dot menu ──────────
function noteCardHTML(n){
  const wasEdited = n.updatedAt && n.updatedAt !== n.createdAt;
  const metaCreated = `<span class="note-meta-item"><b>Created</b> ${fmtTimestamp(n.createdAt)}</span>`;
  const metaEdited  = wasEdited ? `<span class="note-meta-item"><b>Edited</b> ${fmtTimestamp(n.updatedAt)}</span>` : '';

  return `<div class="note-card">
    <div class="note-card-body" onclick="openNoteDetail(${jsArg(n.id)})">
      <div class="note-card-title">${esc(n.title || 'Untitled')}</div>
      <div class="note-meta">${metaCreated}${metaEdited}</div>
    </div>
    <div style="position:relative;">
      <button class="note-menu-btn" onclick="toggleNoteMenu(event,${jsArg(n.id)})" aria-label="Note options">···</button>
      <div class="note-menu-dropdown" id="noteMenu_${esc(n.id)}" style="display:none;">
        <button onclick="closeNoteMenus();openNoteModal(${jsArg(n.id)})">Edit</button>
        <button class="danger" onclick="closeNoteMenus();confirmDeleteNote(${jsArg(n.id)})">Delete</button>
      </div>
    </div>
  </div>`;
}

function renderNotes(){
  const el = document.getElementById('notesList');
  if(!el) return;
  const sorted = notes.slice().sort((a,b) => (b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||''));
  el.innerHTML = sorted.length ? sorted.map(noteCardHTML).join('') :
    `<div class="notes-empty">
      <div class="notes-empty-icon">📋</div>
      <div class="notes-empty-text"><strong>No notes yet</strong>Tap "New note" to create your first note — it stays until you delete it.</div>
    </div>`;
}

// ── Three-dot menu helpers ──────────────────────────────────
function toggleNoteMenu(e, noteId){
  e.stopPropagation();
  const menu = document.getElementById('noteMenu_' + noteId);
  if(!menu) return;
  const isOpen = menu.style.display !== 'none';
  closeNoteMenus();
  if(!isOpen) menu.style.display = 'block';
}

function closeNoteMenus(){
  document.querySelectorAll('.note-menu-dropdown').forEach(m => m.style.display = 'none');
}

// close menus on any outside tap
document.addEventListener('click', ()=>closeNoteMenus());

// ── Note detail modal (read-only view, checklist-toggleable) ─
function openNoteDetail(noteId){
  const note = notes.find(n => String(n.id) === String(noteId));
  if(!note) return;

  document.getElementById('noteDetailTitle').textContent = note.title || 'Untitled';

  const wasEdited = note.updatedAt && note.updatedAt !== note.createdAt;
  const metaCreated = `<span class="note-meta-item"><b>Created</b> ${fmtTimestamp(note.createdAt)}</span>`;
  const metaEdited  = wasEdited ? `<span class="note-meta-item"><b>Edited</b> ${fmtTimestamp(note.updatedAt)}</span>` : '';
  document.getElementById('noteDetailMeta').innerHTML = metaCreated + metaEdited;

  let content = '';
  if(note.contentType === 'text'){
    content = note.body ? `<div class="note-detail-body">${esc(note.body)}</div>` : '<div class="empty">No content yet.</div>';
  } else if(note.contentType === 'list'){
    content = note.checklist && note.checklist.length
      ? `<div class="note-checklist-wrap">${note.checklist.map(c=>`
          <div class="note-sub-row ${c.done?'done':''}" onclick="toggleNoteSubItemFromDetail(${jsArg(note.id)},${jsArg(c.id)})">
            <div class="note-sub-check"></div>
            <div class="note-sub-text">${esc(c.text)}</div>
          </div>`).join('')}</div>`
      : '<div class="empty">No items yet.</div>';
  }
  document.getElementById('noteDetailContent').innerHTML = content;
  document.getElementById('noteDetailModal').classList.add('show');
}

function closeNoteDetailModal(){
  document.getElementById('noteDetailModal').classList.remove('show');
}

function toggleNoteSubItemFromDetail(noteId, subId){
  const note = notes.find(n => String(n.id) === String(noteId));
  if(!note || !note.checklist) return;
  const item = note.checklist.find(c => String(c.id) === String(subId));
  if(!item) return;
  item.done = !item.done;
  note.updatedAt = new Date().toISOString();
  saveNotes();
  renderNotes();
  // refresh detail modal in place
  openNoteDetail(noteId);
}

// ── Note edit modal ─────────────────────────────────────────
function toggleNoteContentUI(){
  const type = document.getElementById('noteContentType').value;
  document.getElementById('wrapNoteText').style.display = type === 'text' ? 'block' : 'none';
  document.getElementById('wrapNoteList').style.display = type === 'list' ? 'block' : 'none';
}

function renderNoteModalChecklist(){
  const wrap = document.getElementById('noteChecklistWrap');
  if(!wrap) return;
  wrap.innerHTML = tempNoteChecklist.map(c =>
    `<div class="note-sub-row ${c.done?'done':''}">
      <div class="note-sub-check" onclick="toggleTempNoteItem(${jsArg(c.id)})"></div>
      <div class="note-sub-text">${esc(c.text)}</div>
      <button onclick="removeTempNoteItem(${jsArg(c.id)})" style="background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:0 0 0 8px;flex-shrink:0;">✕</button>
    </div>`
  ).join('');
}

function toggleTempNoteItem(id){
  const item = tempNoteChecklist.find(c => String(c.id) === String(id));
  if(item){ item.done = !item.done; renderNoteModalChecklist(); }
}

function removeTempNoteItem(id){
  tempNoteChecklist = tempNoteChecklist.filter(c => String(c.id) !== String(id));
  renderNoteModalChecklist();
}

function addNoteSubItem(){
  const input = document.getElementById('noteSubInput');
  const text = input.value.trim();
  if(!text) return;
  tempNoteChecklist.push({ id: createId(), text, done: false });
  input.value = '';
  renderNoteModalChecklist();
}

function openNoteModal(noteId){
  editNoteId = noteId || null;
  const isEdit = !!editNoteId;
  const note = isEdit ? notes.find(n => String(n.id) === String(noteId)) : null;

  document.getElementById('noteModalTitle').textContent = isEdit ? 'Edit Note' : 'New Note';
  document.getElementById('noteTitle').value = note ? note.title : '';
  document.getElementById('noteBody').value = (note && note.contentType === 'text') ? note.body : '';
  document.getElementById('noteContentType').value = (note && note.contentType === 'list') ? 'list' : 'text';
  tempNoteChecklist = (note && note.checklist) ? JSON.parse(JSON.stringify(note.checklist)) : [];

  // timestamps in edit modal
  const metaWrap = document.getElementById('noteModalMeta');
  const metaCreated = document.getElementById('noteMetaCreated');
  const metaUpdated = document.getElementById('noteMetaUpdated');
  if(isEdit && note){
    metaWrap.style.display = 'flex';
    metaCreated.innerHTML = `<b>Created</b> ${fmtTimestamp(note.createdAt)}`;
    const wasEdited = note.updatedAt && note.updatedAt !== note.createdAt;
    metaUpdated.style.display = wasEdited ? 'inline' : 'none';
    if(wasEdited) metaUpdated.innerHTML = `<b>Last edited</b> ${fmtTimestamp(note.updatedAt)}`;
  } else {
    metaWrap.style.display = 'none';
  }

  toggleNoteContentUI();
  renderNoteModalChecklist();
  document.getElementById('noteModal').classList.add('show');
  if(!isEdit) setTimeout(()=>document.getElementById('noteTitle').focus(), 120);
}

function closeNoteModal(){
  document.getElementById('noteModal').classList.remove('show');
  editNoteId = null;
  tempNoteChecklist = [];
}

function saveNote(){
  const title = document.getElementById('noteTitle').value.trim();
  if(!title){ alert('Please give this note a title.'); return; }
  const contentType = document.getElementById('noteContentType').value;
  const now = new Date().toISOString();

  if(editNoteId){
    const note = notes.find(n => String(n.id) === String(editNoteId));
    if(!note) return;
    note.title = title;
    note.contentType = contentType;
    note.body = contentType === 'text' ? document.getElementById('noteBody').value : '';
    note.checklist = contentType === 'list' ? tempNoteChecklist.map(c=>({...c})) : [];
    note.updatedAt = now;
  } else {
    notes.push({
      id: createId(), title, contentType,
      body: contentType === 'text' ? document.getElementById('noteBody').value : '',
      checklist: contentType === 'list' ? tempNoteChecklist.map(c=>({...c})) : [],
      createdAt: now, updatedAt: now
    });
  }
  saveNotes();
  closeNoteModal();
  renderNotes();
}

function confirmDeleteNote(noteId){
  const note = notes.find(n => String(n.id) === String(noteId));
  if(!note) return;
  notes = notes.filter(n => String(n.id) !== String(noteId));
  saveNotes();
  renderNotes();
  const captured = note;
  showUndoToast({title: note.title});
  if(lastDeleted) lastDeleted._undoFn = ()=>{
    notes.push(captured);
    saveNotes();
    renderNotes();
  };
}

// Legacy alias kept for backward compat in case called elsewhere
function deleteNote(){ if(editNoteId) confirmDeleteNote(editNoteId); }

function toggleNoteSubItem(noteId, subId){
  const note = notes.find(n => String(n.id) === String(noteId));
  if(!note || !note.checklist) return;
  const item = note.checklist.find(c => String(c.id) === String(subId));
  if(!item) return;
  item.done = !item.done;
  note.updatedAt = new Date().toISOString();
  saveNotes();
  renderNotes();
}

document.getElementById('modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.getElementById('dayModal').addEventListener('mousedown',e=>{if(e.target.id==='dayModal')closeDayModal()});
document.getElementById('noteModal').addEventListener('mousedown',e=>{if(e.target.id==='noteModal')closeNoteModal()});
document.getElementById('noteDetailModal').addEventListener('mousedown',e=>{if(e.target.id==='noteDetailModal')closeNoteDetailModal()});
document.getElementById('subInput').addEventListener('keydown', e=>{if(e.key === 'Enter') { e.preventDefault(); addSubItem(); }});
document.getElementById('noteSubInput').addEventListener('keydown', e=>{if(e.key === 'Enter'){e.preventDefault();addNoteSubItem();}});

function getPreferredTheme(){
  const saved=safeGet(THEME_KEY);
  if(saved==='light' || saved==='dark') return saved;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function renderThemeIcon(theme){
  const btn=document.getElementById('themeBtn');
  if(!btn) return;
  if(theme==='dark'){
    btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>';
    btn.setAttribute('aria-label','Switch to light mode');btn.title='Switch to light mode';
  }else{
    btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 15.5A7.5 7.5 0 1 1 8.5 5 7.5 7.5 0 0 0 19 15.5Z"></path></svg>';
    btn.setAttribute('aria-label','Switch to dark mode');btn.title='Switch to dark mode';
  }
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  renderThemeIcon(theme);
}

function toggleTheme(){
  const current=document.documentElement.getAttribute('data-theme') || getPreferredTheme();
  const next=current==='dark'?'light':'dark';
  safeSet(THEME_KEY,next);
  applyTheme(next);
}

applyTheme(getPreferredTheme());

// Safety fallback for rendered task interactions
document.addEventListener('click', function(e){
  const el=e.target.closest('[data-task-id]');
  if(!el) return;
  if(e.target.closest('.check, .subtask')) return;
  const id=el.getAttribute('data-task-id');
  if(id){ e.preventDefault(); editTask(id); }
});

// --- PWA: installability ---
let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'inline-block';
});

function installApp(){
  const btn = document.getElementById('installBtn');
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(() => {
    deferredInstallPrompt = null;
    if (btn) btn.style.display = 'none';
  });
}

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'none';
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch((err) => {
      console.warn('Service worker registration failed:', err);
    });
  });
}

seed();renderAll();
</script>

<script>
/* Checklist interaction safety layer */
document.addEventListener('click', function(e) {
  const check = e.target.closest('.check');
  if (!check) return;
  e.preventDefault();
  e.stopPropagation();
  const taskEl = check.closest('[data-task-id]');
  if (!taskEl) return;
  const taskId = taskEl.getAttribute('data-task-id');

  const subtaskEl = check.closest('[data-subtask-id]');
  if (subtaskEl && typeof toggleSubTask === 'function') {
    toggleSubTask(taskId, subtaskEl.getAttribute('data-subtask-id'), e);
  } else if (typeof toggleTask === 'function') {
    toggleTask(taskId, e);
  }
}, true);

document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const check = e.target.closest('.check');
  if (!check) return;
  e.preventDefault();
  check.click();
});
</script>
